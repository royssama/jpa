# --- SQLite: DBeaver Chinook 샘플 DB (Customer 등 테이블·데이터 포함) ---
# 경로는 본인 PC 기준. 다른 머신이면 spring.datasource.url 만 맞추면 됨.
#
# JPA·MyBatis는 동시에 켜져 있음. 조회/변경 경로는 CustomerServiceImpl 메서드에서 직접 선택.

spring:
  datasource:
    url: jdbc:sqlite:C:/Users/phy/AppData/Roaming/DBeaverData/workspace6/.metadata/sample-database-sqlite-1/Chinook.db
    driver-class-name: org.sqlite.JDBC
    # username / password — SQLite 단일 파일은 보통 불필요
  jpa:
    hibernate:
      ddl-auto: update
      # Chinook PascalCase 컬럼·테이블명과 매핑
      naming:
        physical-strategy: org.hibernate.boot.model.naming.PhysicalNamingStrategyStandardImpl
    # true면 콘솔에 "Hibernate: ... ?" 만 나오고 바인딩 값은 안 붙음 → 로깅으로 SQL+파라미터 통일
    show-sql: false
    properties:
      hibernate:
        format_sql: true
        dialect: org.hibernate.community.dialect.SQLiteDialect

mybatis:
  mapper-locations: classpath:mapper/**/*.xml
  type-aliases-package: com.example.backend.domain
  configuration:
    map-underscore-to-camel-case: true

springdoc:
  swagger-ui:
    path: /swagger-ui.html

# DataSource 프록시: 기본 SLF4J 리스너는 끄고, InlinedSqlLoggingConfig 가 ? 를 값으로 치환해 jdbc.sql 로 출력
decorator:
  datasource:
    datasource-proxy:
      logging: slf4j
      query:
        enable-logging: false
      multiline: false

logging:
  file:
    path: logs
  level:
    org.hibernate.SQL: warn
    org.hibernate.orm.jdbc.bind: warn
    org.hibernate.type.descriptor.sql: warn
    jdbc.sql: info
